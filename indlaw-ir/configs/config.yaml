seed: 42

paths:
  raw_dir: data/raw/college
  chunks: data/processed/chunks.jsonl
  faiss_index: indexes/college_bge_base/index.faiss
  faiss_metadata: indexes/college_bge_base/metadata.json
  embeddings: indexes/college_bge_base/embeddings.npy
  bm25_index: indexes/college_bm25/index.pkl
  bm25_metadata: indexes/college_bm25/metadata.json

model:
  name: BAAI/bge-base-en-v1.5

chunking:
  target_tokens: 180
  max_tokens: 300

search:
  dense_top_k: 50
  bm25_top_k: 50
  final_top_k: 5
  rrf_k: 60

query:
  history_turns: 3

retrieval:
  # No uncalibrated absolute cosine threshold is used for answers.
  min_query_terms: 1

evidence_selection:
  top_k: 3
  similarity_threshold: 0.90
  semantic_weight: 0.25
  bm25_weight: 0.10
  rrf_weight: 0.15
  domain_weight: 0.30
  intent_weight: 0.25
  quality_weight: 0.15
  task_weight: 0.20
  contradiction_weight: 0.25
  redundancy_weight: 0.25
