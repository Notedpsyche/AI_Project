seed: 42

paths:
  raw_dir: data/raw/doc2dial
  chunks: data/processed/chunks.jsonl
  faiss_index: indexes/faiss_bge_base/index.faiss
  faiss_metadata: indexes/faiss_bge_base/metadata.json
  embeddings: indexes/faiss_bge_base/embeddings.npy
  bm25_index: indexes/bm25/index.pkl
  bm25_metadata: indexes/bm25/metadata.json

model:
  name: BAAI/bge-base-en-v1.5

chunking:
  target_tokens: 400
  max_tokens: 512

search:
  dense_top_k: 50
  bm25_top_k: 50
  final_top_k: 5
  rrf_k: 60

query:
  history_turns: 3

retrieval:
  semantic_threshold: 0.67

evidence_selection:
  top_k: 3
  similarity_threshold: 0.90
  semantic_weight: 0.25
  bm25_weight: 0.10
  rrf_weight: 0.15
  domain_weight: 0.30
  intent_weight: 0.25
  quality_weight: 0.15
  task_weight: 0.20
  contradiction_weight: 0.25
  redundancy_weight: 0.25
