[project]
name = "iiitk-applicant-assistant"
version = "0.1.0"
description = "Local, source-grounded IIIT Kottayam applicant assistant"
requires-python = ">=3.11"
dependencies = [
    "faiss-cpu>=1.8",
    "fastapi>=0.115",
    "beautifulsoup4>=4.12",
    "numpy>=1.26",
    "pypdf>=5.0",
    "pyyaml>=6.0",
    "rank-bm25>=0.2",
    "scikit-learn>=1.5",
    "sentence-transformers>=3.0",
    "streamlit>=1.35",
    "torch>=2.2",
    "tqdm>=4.66",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc2dial_retrieval"]
